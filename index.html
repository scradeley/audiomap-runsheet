<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#0c0f13">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Run Sheet">
<title>AudioMap — Demo Run Sheet</title>
<style>
  :root {
    --bg:#0c0f13; --panel:#141922; --panel-2:#1b222d; --line:#29323f;
    --ink:#eef2f6; --ink-dim:#9aa7b6; --ink-faint:#63707f;
    --signal:#4fd08a; --signal-dim:#2f7d55;
    --say:#f7bd52; --say-bg:rgba(247,189,82,0.12); --say-line:#f7bd52;
    --new:#62b6ff; --new-bg:rgba(98,182,255,0.12);
    --mono: ui-monospace,"SF Mono","JetBrains Mono",Menlo,Consolas,monospace;
    --sans: system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --bar-h: 62px;
  }
  :root[data-theme="light"] {
    --bg:#f4f6f8; --panel:#ffffff; --panel-2:#eef1f5; --line:#d7dde5;
    --ink:#131920; --ink-dim:#4c5866; --ink-faint:#8a95a2;
    --signal:#1a9257; --signal-dim:#8fd6b1;
    --say:#9a6410; --say-bg:rgba(154,100,16,0.10); --say-line:#c6892a;
    --new:#1f7fd6; --new-bg:rgba(31,127,214,0.10);
  }

  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; height:100%; }
  html {
    background:var(--bg); color:var(--ink);
    font-family:var(--sans); font-size:17px; line-height:1.45;
    -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  }
  body {
    scroll-snap-type: y proximity;
    overflow-y: scroll; height:100dvh;
    -webkit-overflow-scrolling:touch;
    scroll-padding-top: 6px;
  }

  /* progress bar */
  .progress {
    position:fixed; top:0; left:0; height:3px; width:0%;
    background:var(--signal); z-index:40;
    transition:width .18s ease; pointer-events:none;
  }
  @media (prefers-reduced-motion: reduce){ .progress{ transition:none; } }

  /* section panels */
  .panel {
    scroll-snap-align:start;
    min-height:100dvh;
    padding: calc(env(safe-area-inset-top) + 20px) 18px calc(var(--bar-h) + env(safe-area-inset-bottom) + 28px);
    display:flex; flex-direction:column; justify-content:flex-start;
  }
  .panel-inner { width:100%; max-width:620px; margin:0 auto; }

  .eyebrow { display:flex; align-items:center; gap:10px; margin-bottom:14px; }
  .eyebrow .num {
    font-family:var(--mono); font-size:14px; font-weight:700;
    color:var(--bg); background:var(--signal);
    width:30px; height:30px; border-radius:8px;
    display:grid; place-items:center; flex-shrink:0;
  }
  .eyebrow h2 {
    font-size:clamp(23px,6.4vw,30px); margin:0; line-height:1.08;
    letter-spacing:-0.015em; text-wrap:balance; font-weight:700;
  }
  .eyebrow .tag {
    font-family:var(--mono); font-size:11px; font-weight:700; letter-spacing:.08em;
    text-transform:uppercase; color:var(--new);
    border:1px solid var(--new); border-radius:6px; padding:3px 8px; flex-shrink:0;
  }

  .steps-line {
    font-family:var(--mono); font-size:13px; color:var(--ink-dim);
    line-height:1.85; margin:0 0 16px; letter-spacing:.01em;
  }
  .steps-line b { color:var(--signal); font-weight:600; }
  .steps-line .sep { color:var(--ink-faint); padding:0 3px; }

  ul { margin:0; padding:0; list-style:none; }
  li { position:relative; padding-left:22px; margin:11px 0; font-size:17px; }
  li::before{
    content:""; position:absolute; left:2px; top:9px;
    width:8px; height:8px; border-radius:2px; background:var(--signal-dim);
  }
  li ul { margin:7px 0 3px; }
  li ul li { margin:6px 0; color:var(--ink-dim); font-size:15.5px; }
  li ul li::before{
    background:none; border:1.5px solid var(--ink-faint);
    width:6px; height:6px; top:8px; border-radius:50%;
  }
  b.k { color:var(--ink); font-weight:650; }

  code {
    font-family:var(--mono); font-size:.84em;
    background:var(--panel-2); color:var(--ink);
    padding:2px 6px; border-radius:5px; white-space:nowrap;
    display:inline-block; margin:2px 0;
  }

  .say {
    display:flex; flex-direction:column; gap:6px;
    background:var(--say-bg); border-left:4px solid var(--say-line);
    border-radius:10px; padding:14px 16px; margin:16px 0 6px;
  }
  .say .lbl {
    font-family:var(--mono); font-size:11px; letter-spacing:.14em;
    text-transform:uppercase; color:var(--say); font-weight:800;
  }
  .say p { margin:0; font-size:17px; line-height:1.4; color:var(--ink); }
  .say p b { color:var(--say); font-weight:700; }

  .subhead {
    font-family:var(--mono); font-size:12px; letter-spacing:.11em;
    text-transform:uppercase; color:var(--ink-faint); margin:18px 0 6px;
  }

  /* title panel */
  .cover .panel-inner{ margin-top:8vh; }
  .cover .kick {
    font-family:var(--mono); font-size:13px; letter-spacing:.18em;
    text-transform:uppercase; color:var(--signal); margin:0 0 14px;
  }
  .cover h1 {
    font-size:clamp(34px,10vw,52px); line-height:1.02; margin:0;
    letter-spacing:-0.025em; text-wrap:balance; font-weight:750;
  }
  .cover .lede { color:var(--ink-dim); font-size:16px; margin:18px 0 0; }
  .cover .legend {
    display:flex; flex-direction:column; gap:8px; margin-top:26px;
    font-family:var(--mono); font-size:13px; color:var(--ink-dim);
  }
  .cover .legend span { display:flex; align-items:center; gap:9px; }
  .swatch { width:13px; height:13px; border-radius:4px; flex-shrink:0; }
  .cover .go {
    margin-top:30px; font-family:var(--mono); font-size:13px;
    color:var(--ink-faint); letter-spacing:.04em;
  }

  /* bottom step bar */
  .bar {
    position:fixed; left:0; right:0; bottom:0; z-index:30;
    background:color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
    border-top:1px solid var(--line);
    padding-bottom:env(safe-area-inset-bottom);
  }
  .bar-scroll {
    display:flex; gap:6px; overflow-x:auto; scrollbar-width:none;
    padding:9px 12px; height:var(--bar-h); align-items:center;
  }
  .bar-scroll::-webkit-scrollbar{ display:none; }
  .bar button {
    flex:0 0 auto; font-family:var(--mono); font-size:12px; letter-spacing:.02em;
    color:var(--ink-dim); background:transparent;
    border:1px solid var(--line); border-radius:999px;
    padding:0 13px; height:40px; min-width:40px; cursor:pointer;
    display:inline-flex; align-items:center; gap:7px; white-space:nowrap;
    transition:color .12s, background .12s, border-color .12s;
  }
  .bar button .bn { font-weight:700; color:var(--ink-faint); }
  .bar button.active {
    color:var(--bg); background:var(--signal); border-color:var(--signal);
  }
  .bar button.active .bn { color:var(--bg); }

  .theme-btn {
    position:fixed; top:calc(env(safe-area-inset-top) + 10px); right:12px; z-index:40;
    width:40px; height:40px; border-radius:50%;
    background:var(--panel); border:1px solid var(--line); color:var(--ink-dim);
    font-size:17px; cursor:pointer; display:grid; place-items:center;
  }
</style>
</head>
<body>

<div class="progress" id="progress"></div>
<button class="theme-btn" id="themeBtn" aria-label="Toggle theme">◐</button>

<div class="gate" id="gate">
  <div class="gate-card">
    <div class="gate-mark">◆</div>
    <p class="gate-kick">AudioMap</p>
    <h1 class="gate-title">Demo Run Sheet</h1>
    <form id="gateForm" autocomplete="off">
      <input id="pw" type="password" inputmode="text" placeholder="Password"
             autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Password">
      <button type="submit">Enter</button>
    </form>
    <p class="gate-err" id="gateErr">&nbsp;</p>
  </div>
</div>

<div id="deck" hidden></div>

<nav class="bar" id="navbar" hidden><div class="bar-scroll" id="barScroll"></div></nav>

<style>
  .gate {
    position:fixed; inset:0; z-index:50; background:var(--bg);
    display:grid; place-items:center; padding:24px;
    padding-top:calc(env(safe-area-inset-top) + 24px);
  }
  .gate-card { width:100%; max-width:340px; text-align:center; }
  .gate-mark { font-family:var(--mono); font-size:34px; color:var(--signal); margin-bottom:6px; }
  .gate-kick { font-family:var(--mono); font-size:12px; letter-spacing:.2em; text-transform:uppercase; color:var(--signal); margin:0 0 6px; }
  .gate-title { font-size:30px; margin:0 0 26px; letter-spacing:-0.02em; font-weight:750; }
  #gateForm { display:flex; flex-direction:column; gap:10px; }
  #pw {
    font-family:var(--sans); font-size:17px; text-align:center;
    color:var(--ink); background:var(--panel); border:1px solid var(--line);
    border-radius:12px; padding:15px 16px; outline:none; width:100%;
  }
  #pw:focus { border-color:var(--signal); }
  #gateForm button {
    font-family:var(--mono); font-size:15px; font-weight:700; letter-spacing:.04em;
    color:var(--bg); background:var(--signal); border:0; border-radius:12px;
    padding:15px; cursor:pointer; width:100%;
  }
  .gate-err { font-family:var(--mono); font-size:13px; color:#ff6b6b; margin:14px 0 0; min-height:18px; }
</style>

41HVl7jaataJbTb/qbupHqc6JcWFlh9ay1jb9fccljIzaRfwq8MvAYuA6nRPK6ivMApB0rjtNpXPM1rxjtmbc4mufn17AFuf3FqwfBENeLS92S8sV31MZaqTcuX+ndqHtDl789URAEWkTY+kYVeyUJJXdsYrg0g0sCPrBvfhd383q8Cu9EmSl4LbYjTKYWosAvzmfRGj8G4+j7JIm+NQxpfNPe32jJkEbxkTMdNnCxE3xa6tZzQPxR9XgCrwKEZGbgapt14bRvblWJHp6gAGVdjYZob0cQXCZM2WCUI41umYUDRyV8dafhDB62vnBBOWEgTL", ITER=150000;
  var enc=new TextEncoder(), dec=new TextDecoder();
  function b(s){ return Uint8Array.from(atob(s), function(c){return c.charCodeAt(0);}); }

  async function decrypt(pw){
    var bk=await crypto.subtle.importKey('raw', enc.encode(pw), 'PBKDF2', false, ['deriveKey']);
    var k=await crypto.subtle.deriveKey(
      {name:'PBKDF2', salt:b(SALT), iterations:ITER, hash:'SHA-256'},
      bk, {name:'AES-GCM', length:256}, false, ['decrypt']);
    var pt=await crypto.subtle.decrypt({name:'AES-GCM', iv:b(IV)}, k, b(DATA));
    return dec.decode(pt);
  }

  function reveal(html){
    var deck=document.getElementById('deck');
    deck.innerHTML=html; deck.hidden=false;
    var gate=document.getElementById('gate'); if(gate) gate.remove();
    document.getElementById('navbar').hidden=false;
    initRunsheet();
  }

  async function tryPw(pw, onFail){
    try {
      var html=await decrypt(pw);
      try { sessionStorage.setItem('rs_pw', pw); } catch(e){}
      reveal(html);
    } catch(e){ if(onFail) onFail(); }
  }

  var form=document.getElementById('gateForm');
  form.addEventListener('submit', function(e){
    e.preventDefault();
    var pw=document.getElementById('pw').value.trim();
    document.getElementById('gateErr').textContent='\u00a0';
    tryPw(pw, function(){
      document.getElementById('gateErr').textContent='Incorrect — try again';
      document.getElementById('pw').select();
    });
  });

  // auto-unlock within the same session
  try {
    var cached=sessionStorage.getItem('rs_pw');
    if(cached) tryPw(cached, function(){ try{sessionStorage.removeItem('rs_pw');}catch(e){} });
  } catch(e){}

  // theme toggle (works pre- and post-unlock)
  document.getElementById('themeBtn').addEventListener('click', function(){
    var r=document.documentElement, cur=r.getAttribute('data-theme')||'dark';
    r.setAttribute('data-theme', cur==='dark'?'light':'dark');
    var m=document.querySelector('meta[name=theme-color]');
    if(m) m.setAttribute('content', cur==='dark'?'#f4f6f8':'#0c0f13');
  });

  // ---- run sheet nav (runs after content is injected) ----
  function initRunsheet(){
    var panels=Array.prototype.slice.call(document.querySelectorAll('.panel'));
    var bar=document.getElementById('barScroll');
    var progress=document.getElementById('progress');
    panels.forEach(function(p,i){
      var btn=document.createElement('button');
      btn.innerHTML=(i===0?'<span class="bn">\u25c6</span>':'<span class="bn">'+i+'</span>')
                    +'<span>'+p.dataset.label+'</span>';
      btn.addEventListener('click', function(){
        document.getElementById(p.id).scrollIntoView({behavior:'smooth', block:'start'});
      });
      bar.appendChild(btn);
    });
    var btns=Array.prototype.slice.call(bar.children);
    function setActive(idx){
      btns.forEach(function(b,i){ b.classList.toggle('active', i===idx); });
      var el=btns[idx]; if(el) el.scrollIntoView({inline:'center', block:'nearest', behavior:'smooth'});
      progress.style.width=(idx/(panels.length-1))*100+'%';
    }
    var io=new IntersectionObserver(function(entries){
      entries.forEach(function(e){
        if(e.isIntersecting){ var idx=panels.indexOf(e.target); if(idx>=0) setActive(idx); }
      });
    }, {rootMargin:'-45% 0px -45% 0px', threshold:0});
    panels.forEach(function(p){ io.observe(p); });
    setActive(0);
    window.scrollTo(0,0);
  }
})();
</script>
